<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
{{FONT_FACES}}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: {{WIDTH}}px;
  height: {{HEIGHT}}px;
  overflow: hidden;
  font-family: 'Inter', sans-serif;
  background: {{DOMINANT_DARK}};
  color: #ffffff;
}
.canvas {
  position: relative;
  width: 100%;
  height: 100%;
  padding: {{MARGIN_Y}}px {{MARGIN_X}}px;
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: 24px;
  overflow: hidden;
}
.hero-photo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 0;
}
.text-scrim {
  position: absolute;
  inset: 0;
  z-index: 1;
  background: linear-gradient(
    180deg,
    rgba(10, 14, 12, 0.36) 0%,
    rgba(10, 14, 12, 0.18) 38%,
    rgba(10, 14, 12, {{OVERLAY_OPACITY}}) 74%,
    rgba(10, 14, 12, 0.94) 100%
  );
}
[data-zone="logo"] {
  position: relative;
  z-index: 2;
  display: inline-flex;
  align-items: center;
  gap: 12px;
  width: fit-content;
  padding: 8px 14px 8px 8px;
  border-radius: 12px;
  background: rgba(12, 16, 14, 0.68);
}
.logo-mark {
  width: 36px; height: 36px; border-radius: 9px;
  background: {{ACCENT_HEX}}; color: {{CTA_TEXT_COLOR}};
  display: flex; align-items: center; justify-content: center;
  font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 19px; overflow: hidden;
}
.logo-mark img { width: 100%; height: 100%; object-fit: cover; }
.logo-text {
  font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 22px; color: #ffffff;
}
.headline-wrap {
  position: relative;
  z-index: 2;
  align-self: end;
}
[data-zone="headline"] {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 800;
  font-size: {{HEADLINE_SIZE}}px;
  line-height: 1.02;
  letter-spacing: -0.035em;
  color: #ffffff;
  text-shadow: 0 4px 28px rgba(0,0,0,0.48);
}
[data-zone="headline"] .accent { color: {{ACCENT_HEX}}; }
[data-zone="info-strip"] {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
  padding: 18px 24px;
  border-radius: 16px;
  background: rgba(14, 19, 16, 0.90);
  border: 2px dashed {{ACCENT_HEX}};
}
.meta-items {
  display: flex; align-items: center; flex-wrap: wrap; gap: 18px;
  font-size: {{META_LARGE_SIZE}}px; font-weight: 700; color: #ffffff;
}
.meta-item { display: inline-flex; align-items: center; gap: 9px; }
.meta-item svg { width: 22px; height: 22px; stroke: {{ACCENT_HEX}}; flex-shrink: 0; }
.chip-pill {
  display: inline-flex; align-items: center; padding: 8px 16px; border-radius: 999px;
  background: rgba(255,255,255,0.12);
  font-size: {{META_FONT_SIZE}}px; font-weight: 700; color: #ffffff;
}
.cta-pill {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 13px 26px; border-radius: 999px;
  background: {{ACCENT_HEX}}; color: {{CTA_TEXT_COLOR}};
  font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: {{META_FONT_SIZE}}px;
  white-space: nowrap;
}
</style>
</head>
<body class="{{ORIENTATION}}">
  <div class="canvas">
    {{HERO_IMG_HTML}}
    <div class="text-scrim"></div>
    <div data-zone="logo">
      <div class="logo-mark">{{LOGO_HTML}}</div>
      <span class="logo-text">Vtab.</span>
    </div>
    <div class="headline-wrap">
      <h1 data-zone="headline">{{HEADLINE_HTML}}</h1>
    </div>
    <div data-zone="info-strip">
      <div class="meta-items">{{META_OR_CHIPS_HTML}}</div>
      {{CTA_HTML}}
    </div>
  </div>
</body>
</html>
