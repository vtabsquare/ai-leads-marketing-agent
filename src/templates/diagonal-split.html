<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
{{FONT_FACES}}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: {{WIDTH}}px;
  height: {{HEIGHT}}px;
  overflow: hidden;
  font-family: 'Inter', sans-serif;
  background: {{PANEL_BG}};
  color: {{TEXT_COLOR}};
}
.canvas {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
}
.photo-half {
  position: absolute;
  inset: 0;
  z-index: 1;
}
body.landscape .photo-half {
  clip-path: polygon(44% 0, 100% 0, 100% 100%, 34% 100%);
}
body.portrait .photo-half {
  clip-path: polygon(0 44%, 100% 34%, 100% 100%, 0 100%);
}
.photo-half img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.text-zone {
  position: relative;
  z-index: 2;
  height: 100%;
  padding: {{MARGIN_Y}}px {{MARGIN_X}}px;
  display: grid;
}
body.landscape .text-zone {
  width: 44%;
  grid-template-rows: auto 1fr auto;
  gap: 20px;
}
body.portrait .text-zone {
  width: 100%;
  height: 44%;
  grid-template-rows: auto 1fr auto;
  gap: 18px;
}
[data-zone="logo"] {
  display: inline-flex; align-items: center; gap: 12px; width: fit-content;
}
.logo-mark {
  width: 38px; height: 38px; border-radius: 10px;
  background: {{ACCENT_HEX}}; color: {{CTA_TEXT_COLOR}};
  display: flex; align-items: center; justify-content: center;
  font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 20px; overflow: hidden;
}
.logo-mark img { width: 100%; height: 100%; object-fit: cover; }
.logo-text {
  font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 23px; color: {{TEXT_COLOR}};
}
.headline-wrap { align-self: center; }
[data-zone="headline"] {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 800;
  font-size: {{HEADLINE_SIZE}}px;
  line-height: 1.03;
  letter-spacing: -0.035em;
  color: {{TEXT_COLOR}};
}
[data-zone="headline"] .accent { color: {{ACCENT_HEX}}; }
[data-zone="info-strip"] {
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
}
.meta-items {
  display: flex; align-items: center; flex-wrap: wrap; gap: 12px;
  font-size: {{META_FONT_SIZE}}px; font-weight: 600; color: {{SUBTEXT_COLOR}};
}
.meta-item { display: inline-flex; align-items: center; gap: 8px; }
.meta-item svg { width: 18px; height: 18px; stroke: {{ACCENT_HEX}}; flex-shrink: 0; }
.chip-pill {
  display: inline-flex; align-items: center; padding: 7px 14px; border-radius: 999px;
  background: rgba(128,128,128,0.16);
  font-size: {{META_FONT_SIZE}}px; font-weight: 600; color: {{TEXT_COLOR}};
}
.cta-pill {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 12px 24px; border-radius: 999px;
  background: {{ACCENT_HEX}}; color: {{CTA_TEXT_COLOR}};
  font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: {{META_FONT_SIZE}}px;
  white-space: nowrap;
}
</style>
</head>
<body class="{{ORIENTATION}} {{THEME_CLASS}}">
  <div class="canvas">
    <div class="photo-half">{{HERO_IMG_HTML}}</div>
    <div class="text-zone">
      <div data-zone="logo">
        <div class="logo-mark">{{LOGO_HTML}}</div>
        <span class="logo-text">Vtab.</span>
      </div>
      <div class="headline-wrap">
        <h1 data-zone="headline">{{HEADLINE_HTML}}</h1>
      </div>
      <div data-zone="info-strip">
        <div class="meta-items">{{META_OR_CHIPS_HTML}}</div>
        {{CTA_HTML}}
      </div>
    </div>
  </div>
</body>
</html>
