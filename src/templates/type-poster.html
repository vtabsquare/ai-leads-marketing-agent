<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
{{FONT_FACES}}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: {{WIDTH}}px;
  height: {{HEIGHT}}px;
  overflow: hidden;
  font-family: 'Inter', sans-serif;
  background: {{PANEL_BG}};
  color: {{TEXT_COLOR}};
}
.canvas {
  position: relative;
  width: 100%;
  height: 100%;
  padding: {{MARGIN_Y}}px {{MARGIN_X}}px;
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: 28px;
  border-left: 12px solid {{ACCENT_HEX}};
  background: linear-gradient(155deg, {{PANEL_BG}} 0%, {{DOMINANT_DARK}} 100%);
}
[data-zone="logo"] {
  display: inline-flex; align-items: center; gap: 12px; width: fit-content;
}
.logo-mark {
  width: 40px; height: 40px; border-radius: 10px;
  background: {{ACCENT_HEX}}; color: {{CTA_TEXT_COLOR}};
  display: flex; align-items: center; justify-content: center;
  font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 21px; overflow: hidden;
}
.logo-mark img { width: 100%; height: 100%; object-fit: cover; }
.logo-text {
  font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 24px; color: {{TEXT_COLOR}};
}
.headline-wrap {
  align-self: center;
  width: 100%;
}
[data-zone="headline"] {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 800;
  font-size: {{HEADLINE_LARGE_SIZE}}px;
  line-height: 1.0;
  letter-spacing: -0.04em;
  color: {{TEXT_COLOR}};
}
[data-zone="headline"] .accent { color: {{ACCENT_HEX}}; }
[data-zone="info-strip"] {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
  padding-top: 20px;
  border-top: 2px solid rgba(255,255,255,0.16);
}
body.light-theme [data-zone="info-strip"] {
  border-top-color: rgba(20,32,25,0.16);
}
.meta-items {
  display: flex; align-items: center; flex-wrap: wrap; gap: 14px;
  font-size: {{META_FONT_SIZE}}px; font-weight: 600; color: {{SUBTEXT_COLOR}};
}
.meta-item { display: inline-flex; align-items: center; gap: 8px; }
.meta-item svg { width: 20px; height: 20px; stroke: {{ACCENT_HEX}}; flex-shrink: 0; }
.chip-pill {
  display: inline-flex; align-items: center; padding: 8px 16px; border-radius: 999px;
  border: 1.5px solid {{ACCENT_HEX}};
  font-size: {{META_FONT_SIZE}}px; font-weight: 600; color: {{TEXT_COLOR}};
}
.cta-pill {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 14px 28px; border-radius: 999px;
  background: {{ACCENT_HEX}}; color: {{CTA_TEXT_COLOR}};
  font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: {{META_FONT_SIZE}}px;
  white-space: nowrap;
}
</style>
</head>
<body class="{{ORIENTATION}} {{THEME_CLASS}}">
  <div class="canvas">
    <div data-zone="logo">
      <div class="logo-mark">{{LOGO_HTML}}</div>
      <span class="logo-text">Vtab.</span>
    </div>
    <div class="headline-wrap">
      <h1 data-zone="headline">{{HEADLINE_HTML}}</h1>
    </div>
    <div data-zone="info-strip">
      <div class="meta-items">{{META_OR_CHIPS_HTML}}</div>
      {{CTA_HTML}}
    </div>
  </div>
</body>
</html>
